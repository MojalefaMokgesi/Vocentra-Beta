name: Build and deploy Vocentra to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release
  # ✅ Your project is at repo root
  APP_PROJECT: "Vocentra.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/publish"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show repo structure
        run: |
          echo "Root files:"
          ls -la
          echo ""
          echo "Find csproj:"
          find . -maxdepth 3 -name "*.csproj" -print
          echo ""
          dotnet --info

      - name: Restore
        run: dotnet restore "${{ env.APP_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.APP_PROJECT }}" -c ${{ env.CONFIGURATION }} --no-restore

      - name: Publish
        run: dotnet publish "${{ env.APP_PROJECT }}" -c ${{ env.CONFIGURATION }} -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
